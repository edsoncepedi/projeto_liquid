# =============================================================================
# MAPA MODBUS VIRTUAL - Teste de liquidificadores
# =============================================================================
#
# ATENCAO / IMPORTANTE
# ---------------------------------------------------------------------------
# Este mapa e VIRTUAL. Os enderecos abaixo foram escolhidos apenas para
# permitir o desenvolvimento do simulador e do middleware antes de o mapa
# real do CLP ser fornecido.
#
# NAO ha garantia de que qualquer endereco aqui corresponda ao CLP real.
# As imagens da IHM mostram a interface de operacao, nao os enderecos.
#
# Quando o mapa real for disponibilizado, altere SOMENTE este arquivo:
#   endereco (address / stride), tipo de dado (data_type), escala (scale),
#   unidade (unit), estacao (scope/stations) e descricao (description).
# Nenhuma logica do simulador ou do middleware precisa ser alterada.
# =============================================================================

version: 1
name: "Mapa virtual - Teste de liquidificadores"

# Ordem das palavras para tipos de 32 bits (uint32/int32): "big" = word alta
# primeiro. Ajustar conforme o CLP real.
word_order: big

stations:
  ids: [1, 2, 3, 4]
  labels:
    1: "ESTACAO 01"
    2: "ESTACAO 02"
    3: "ESTACAO 03"
    4: "ESTACAO 04"

# Tamanho das areas de memoria do CLP virtual.
memory_size:
  coil: 512
  discrete_input: 512
  holding_register: 512
  input_register: 512

# Enumeracoes: valor numerico no CLP -> rotulo de negocio.
enums:
  station_status:
    0: VAZIO
    1: PRODUTO_INSERIDO
    2: TESTANDO
    3: APROVADO
    4: REPROVADO

# ---------------------------------------------------------------------------
# Pontos
# ---------------------------------------------------------------------------
# scope: "global" (endereco unico) ou "station" (endereco = address + (n-1)*stride)
# kind:  coil | discrete_input | holding_register | input_register
# access: r (somente leitura) | rw | w (somente escrita/comando)
# deadband: variacao minima (ja escalada) para o middleware considerar mudanca
# ---------------------------------------------------------------------------
points:

  - name: voltage
    label: "Tensao da bancada"
    scope: global
    kind: holding_register
    address: 0
    data_type: uint16
    scale: 0.1          # bruto 1210 -> 121.0 V
    unit: V
    decimals: 1
    access: rw
    deadband: 0.5
    min: 0              # min/max em unidade de engenharia (ja escalada)
    max: 300
    description: "Tensao de alimentacao lida pela bancada (comum as estacoes)."

  - name: status
    label: "Estado da estacao"
    scope: station
    kind: holding_register
    address: 100        # estacao 1 = 100, 2 = 120, 3 = 140, 4 = 160
    stride: 20
    data_type: uint16
    enum: station_status
    access: rw
    description: "Estado atual do ciclo de teste da estacao."

  - name: power
    label: "Potencia"
    scope: station
    kind: holding_register
    address: 101
    stride: 20
    data_type: uint16
    scale: 1.0
    unit: W
    decimals: 0
    access: rw
    deadband: 5         # ignora ruido de +/- 5 W
    min: 0
    max: 2000
    description: "Potencia medida do produto em teste."

  - name: total
    label: "Total"
    scope: station
    kind: holding_register
    address: 102        # uint32 ocupa 2 registradores (102-103)
    stride: 20
    data_type: uint32
    access: rw
    min: 0
    description: "Contador total de pecas testadas."

  - name: approved
    label: "Aprovado"
    scope: station
    kind: holding_register
    address: 104        # 104-105
    stride: 20
    data_type: uint32
    access: rw
    min: 0
    description: "Contador de pecas aprovadas."

  - name: rejected
    label: "Reprovado"
    scope: station
    kind: holding_register
    address: 106        # 106-107
    stride: 20
    data_type: uint32
    access: rw
    min: 0
    description: "Contador de pecas reprovadas."

  - name: positions
    label: "Posicoes"
    scope: station
    kind: coil
    address: 0          # estacao 1 = 0..12, 2 = 16..28, 3 = 32..44, 4 = 48..60
    stride: 16
    count: 13
    data_type: bool
    access: rw
    item_labels: [P, V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12]
    description: "Sinalizadores P e V1..V12 mostrados na IHM."

  - name: cmd_reset
    label: "Comando de reset"
    scope: station
    kind: coil
    address: 200        # estacao 1 = 200, 2 = 201, 3 = 202, 4 = 203
    stride: 1
    data_type: bool
    access: w
    description: >
      Pulso de reset dos contadores da estacao. Escrito pelo middleware
      quando a aplicacao envia o comando "reset". O programa do CLP (aqui,
      o simulador) zera os contadores e devolve a coil para 0.
